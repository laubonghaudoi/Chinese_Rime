    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
  filters:
    - lua_filter@*gannyu_annotation_filter
    - lua_filter@*gannyu_single_char_filter
    - lua_filter@*gannyu_relation_filter
    - uniquifier

