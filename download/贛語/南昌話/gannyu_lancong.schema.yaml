
schema:
  schema_id: gannyu_lancong
  name: 赣语－南昌
  version: "0.2.3"
  author:
    - GannyuInputMethod contributors
  description: |
    从项目规范词典生成；使用 Rime 原生用户学习，Lua 提供标注和连带候选。

switches:
  - name: ascii_mode
    reset: 0
    states: [赣语－南昌, 西]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
  filters:
    - lua_filter@*gannyu_filter
    - uniquifier

